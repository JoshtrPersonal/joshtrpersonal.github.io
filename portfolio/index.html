<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="stylesheet" href="josh.css">
  <link rel="stylesheet" href="index.css">
  <style>
    .portfolio-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .portfolio-item {
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }
    .portfolio-item:hover {
      transform: scale(1.03);
    }
    .portfolio-item img, .portfolio-item video {
      width: 100%;
      height: auto;
      display: block;
    }
    .portfolio-title {
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 20px;
      background-color: #f0f0f0;
    }
  </style>
  <script type="text/javascript" src="/image-protect.js" defer=""></script>
</head>
<body>
  <header>
    <div class="portfolio-title">My Photography & Videography</div>
  </header>
  <main>
    <div id="photo-grid" class="portfolio-container"></div>
    <div id="video-grid" class="portfolio-container"></div>
  </main>
  <script>
    const portfolioFolder = 'portfolio/';
    const supportedPhotos = ['jpg', 'jpeg', 'png', 'gif'];
    const supportedVideos = ['mp4', 'webm', 'ogg'];

    async function loadPortfolio() {
      try {
        const response = await fetch(portfolioFolder);
        const html = await response.text();
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;

        const links = tempDiv.querySelectorAll('a');
        links.forEach(link => {
          const href = link.getAttribute('href');
          const fileType = href.split('.').pop().toLowerCase();

          if (supportedPhotos.includes(fileType)) {
            addPhoto(href);
          } else if (supportedVideos.includes(fileType)) {
            addVideo(href);
          }
        });
      } catch (err) {
        console.error('Error loading portfolio:', err);
      }
    }

    function addPhoto(src) {
      const container = document.getElementById('photo-grid');
      const div = document.createElement('div');
      div.className = 'portfolio-item';
      div.innerHTML = `<img src="${portfolioFolder + src}" alt="Photo">`;
      container.appendChild(div);
    }

    function addVideo(src) {
      const container = document.getElementById('video-grid');
      const div = document.createElement('div');
      div.className = 'portfolio-item';
      div.innerHTML = `<video controls src="${portfolioFolder + src}"></video>`;
      container.appendChild(div);
    }

    loadPortfolio();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3D Printer Live Monitor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 1rem;
      background: #292929;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    .video-container {
      width: 90%;
      max-width: 960px;
      aspect-ratio: 16/9;
      margin-bottom: 1.5rem;
      margin-top: 46px;
      border: 4px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }
    .video-container video {
      width: 100%;
      height: 100%;
    }
    .buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .buttons button {
      padding: 0.75rem 1.5rem;
      background-color: #e63946;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s ease;
    }
    .buttons button:hover {
      background-color: #ff4d5b;
    }
      .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }
    .top-nav a { color:#fff; text-decoration:none; padding:6px 10px; border-radius:6px; }
    .top-nav a:hover, .top-nav a.active { background: rgba(255,255,255,0.2); }
</style>
  <script type="text/javascript" src="/image-protect.js" defer=""></script>
</head>
<body>
  <nav class="top-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/contact/">Contact</a><a href="/portfolio/">Portfolio</a></nav>

  <header>Live Monitor</header>

  <div class="container">
    <div class="video-container">
      <video
        id="live-video"
        class="video-js vjs-default-skin vjs-fluid"
        controls
        autoplay
        playsinline
        crossorigin="anonymous"
      ></video>
    </div>

    <!--<div class="buttons">
      <button onclick="sendDiscordAlert('⚠️ Filament Runout!')">Filament Runout</button>
      <button onclick="sendDiscordAlert('🔥 EMERGENCY!')">Emergency Alert</button>
      <button onclick="sendDiscordAlert('🛑 Print Failed')">Print Failed</button>
      <button onclick="sendDiscordAlert('✅ Print Completed Successfully')">Print Complete</button>
    </div> -->
  </div>


  <!-- Video.js and HLS support -->
  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const video = document.getElementById('live-video');
    const videoSrc = 'http://5.198.49.76:8080/hls/stream.m3u8';


    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
    } else if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    }

    videojs(video);
  </script>

  <script>
    function sendDiscordAlert(message) {
      fetch("https://discord.com/api/webhooks/1393530899311628379/GbeExMpOZhbvCeZcN6bhyzg6wrocI469mxPQ24HmuBgvOqiOhNDbqDOmk3enq4wqBGt9", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: message })
      })
      .then(() => alert("Alert sent!"))
      .catch(() => alert("Failed to send alert"));
    }
  </script>

</body>
</html>

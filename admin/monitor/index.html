<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Live Camera Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet">

  <style>
    /* Make html/body fill the screen with no scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: black;
    }

    /* Force the player & its video tech to cover the viewport */
    .video-js,
    .video-js .vjs-tech {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>
<body>
  <video
  id="live-video"
  class="video-js vjs-default-skin"
  controls
  autoplay
  width="1920" height="1080"
  data-setup='{}'>
  <source
    src="http://5.198.49.76/hls/stream.m3u8"
    type="application/x-mpegURL" />
</video>

  <!-- Video.js script -->
  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
</body>
</html>
